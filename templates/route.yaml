{{- if .Values.openshift.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "boundary.controller.route.api.name" . }}
  namespace: {{ include "boundary.namespace" . }}
  labels:
    {{- include "boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.openshift.route.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.openshift.route.api.host }}
  host: {{ .Values.openshift.route.api.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "boundary.controller.apiServiceName" . }}
  port:
    targetPort: api
  tls:
    termination: {{ .Values.openshift.route.api.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.openshift.route.api.tls.insecureEdgeTerminationPolicy }}
    {{- if and (not .Values.tls.disabled) (eq .Values.openshift.route.api.tls.termination "reencrypt") .Values.openshift.route.api.tls.destinationCACertificate }}
    destinationCACertificate: |
      {{- .Values.openshift.route.api.tls.destinationCACertificate | nindent 6 }}
    {{- end }}
{{- end }}
{{- if .Values.openshift.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "boundary.controller.route.cluster.name" . }}
  namespace: {{ include "boundary.namespace" . }}
  labels:
    {{- include "boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.openshift.route.cluster.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.openshift.route.cluster.host }}
  host: {{ .Values.openshift.route.cluster.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "boundary.controller.clusterServiceName" . }}
  port:
    targetPort: cluster
  tls:
    termination: {{ .Values.openshift.route.cluster.tls.termination }}
{{- end }}
{{- if .Values.openshift.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "boundary.controller.route.ops.name" . }}
  namespace: {{ include "boundary.namespace" . }}
  labels:
    {{- include "boundary.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.openshift.route.ops.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.openshift.route.ops.host }}
  host: {{ .Values.openshift.route.ops.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "boundary.controller.opsServiceName" . }}
  port:
    targetPort: ops
  tls:
    termination: {{ .Values.openshift.route.ops.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.openshift.route.ops.tls.insecureEdgeTerminationPolicy }}
    {{- if and (not .Values.tls.disabled) (eq .Values.openshift.route.ops.tls.termination "reencrypt") .Values.openshift.route.ops.tls.destinationCACertificate }}
    destinationCACertificate: |
      {{- .Values.openshift.route.ops.tls.destinationCACertificate | nindent 6 }}
    {{- end }}
{{- end }}
