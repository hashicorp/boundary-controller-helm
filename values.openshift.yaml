# These overrides are appropriate defaults for deploying this chart on OpenShift.
# Usage:
#   helm install boundary-controller . \
#     --namespace boundary \
#     --create-namespace \
#     -f values.openshift.yaml \
#     -f my-secrets-values.yaml

image:
  repository: registry.connect.redhat.com/hashicorp/boundary-enterprise
  tag: "1.0-ent"

# TLS — disabled on API and Ops listeners because the OCP router (edge termination)
# handles TLS externally. The cluster listener (9201) always uses Boundary's own mTLS
# regardless of this setting — do not change that.
tls:
  disabled: true

openshift:
  enabled: true
  route:
    api:
      enabled: true
      # Leave empty to let OpenShift auto-assign a hostname from the cluster's
      # ingress domain (e.g. boundary-controller-api-boundary.apps.cluster.example.com).
      host: ""
      tls:
        # edge terminates TLS at the OCP router; controller API listener runs with tls_disable=true.
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      annotations: {}
    cluster:
      enabled: true
      # Leave empty to let OpenShift auto-assign a hostname.
      host: ""
      tls:
        # passthrough is required — the cluster port carries Boundary's own mTLS.
        termination: passthrough
      annotations: {}
    ops:
      enabled: true
      # Leave empty to let OpenShift auto-assign a hostname.
      host: ""
      tls:
        # edge terminates TLS at the OCP router; ops listener runs with tls_disable=true.
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      annotations: {}

# ServiceAccount — provide an existing ServiceAccount bound to a compatible SCC.
# After creating, grant the restricted-v2 SCC if your namespace policy requires it:
#   oc adm policy add-scc-to-user restricted-v2 -z boundary-controller -n <namespace>
#
# SCC requirements for the boundary-controller pod:
#   - runAsNonRoot: true   (OCP assigns a UID from the namespace range)
#   - allowPrivilegeEscalation: false
#   - readOnlyRootFilesystem: true
#   - All capabilities dropped
# The built-in "restricted-v2" SCC (OCP 4.11+) satisfies all of the above.
# On OCP 4.10 and earlier, use "restricted".
serviceAccount:
  name: "boundary-controller"
  automountServiceAccountToken: false

controller:
  # After install, set this to the cluster Route hostname so external workers can reach
  # the controller on port 9201. Get the hostname with:
  #   oc get route boundary-controller-cluster-route -n <namespace> -o jsonpath='{.spec.host}'
  # Then upgrade:
  #   helm upgrade boundary-controller . -f values.openshift.yaml --set controller.publicClusterAddr=<hostname>
  publicClusterAddr: ""
  service:
    api:
      # On OpenShift the API port is exposed via the Route above; a LoadBalancer is not needed.
      type: ClusterIP
