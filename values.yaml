nameOverride: ""
fullnameOverride: ""
# Overrides the namespace for all resources. Leave empty to use the Helm release namespace.
# Set only for GitOps tools (e.g. ArgoCD) that track the release in a separate namespace.
namespace: ""

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------

tls:
  # When false, the TLS Secret is mounted for listeners that reference tls_cert_file/tls_key_file.
  # When true, no Secret is required.
  # Probe scheme (HTTP/HTTPS) is derived from the ops listener's tls_disable param, not this flag.
  disabled: false
  secretName: "boundary-controller-tls"
  mountPath: "/etc/boundary/tls"
# ---------------------------------------------------------------------------
# Secret References
# ---------------------------------------------------------------------------

secretRefs:
  secretName: "boundary-controller-secrets"
  # When true, validates the Secret exists with all required keys at render time.
  validateExisting: false
  keys:
    databaseUrl: "database-url"
    migrationUrl: "migration-url"
    license: "license"
    adminUsername: "admin-username"
    adminPassword: "admin-password"

# ---------------------------------------------------------------------------
# Controller
# ---------------------------------------------------------------------------

controller:
  replicas: 2
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

  config: |
    disable_mlock = true

    listener "tcp" {
      address = "0.0.0.0:9200"
      purpose = "api"
      tls_disable   = "{{ .Values.tls.disabled}}"
      tls_cert_file = "{{ .Values.tls.mountPath }}/tls.crt"
      tls_key_file  = "{{ .Values.tls.mountPath }}/tls.key"
    }

    listener "tcp" {
      address = "0.0.0.0:9201"
      purpose = "cluster"
    }

    listener "tcp" {
      address = "0.0.0.0:9203"
      purpose = "ops"
      tls_disable   = "{{ .Values.tls.disabled}}"
      tls_cert_file = "{{ .Values.tls.mountPath }}/tls.crt"
      tls_key_file  = "{{ .Values.tls.mountPath }}/tls.key"
    }

    # https://developer.hashicorp.com/boundary/docs/configuration/controller
    controller {
      name = "boundary-controller"
      public_cluster_addr = "{{ (printf "%s:9201" (include "boundary.controller.clusterServiceName" .)) }}"
      license = "env://BOUNDARY_LICENSE"

      database {
        url = "env://BOUNDARY_PG_URL"
      }

      graceful_shutdown_wait_duration = "10s"
    }

    # AEAD is for development and testing only — keys are stored in plaintext.
    # Replace with a production KMS provider before deploying.
    # https://developer.hashicorp.com/boundary/docs/configuration/kms/aead
    kms "aead" {
      purpose   = "root"
      aead_type = "aes-gcm"
      key       = "sP1fnF5Xz85RrXyELHFeZg9Ad2qt4Z4bgNHVGtD6sFo="
      key_id    = "global_root"
    }

    kms "aead" {
      purpose   = "recovery"
      aead_type = "aes-gcm"
      key       = "8fZBjCUfN0TzjEGLQldGY4+iE9AkOvCfjh7+p0GtRBQ="
      key_id    = "global_recovery"
    }

    kms "aead" {
      purpose   = "worker-auth"
      aead_type = "aes-gcm"
      key       = "ATTK2pMjMTEJGlAkUJAePnFMlNLQaXBnhSqJHVlJeKQ="
      key_id    = "global_worker-auth"
    }

    events {
      audit_enabled        = true
      sysevents_enabled    = true
      observations_enabled = true
      sink "stderr" {
        name = "all-events"
        description = "All events sent to stderr"
        event_types = ["*"]
        format = "hclog-text"
      }
    }

  livenessProbe:
    # Probe scheme for /health on the ops listener. Auto-derived from the ops
    # listener's tls_disable param (HTTPS unless tls_disable=true). Override only if needed.
    scheme: ""
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

  readinessProbe:
    # Probe scheme for /health on the ops listener. Auto-derived from the ops
    # listener's tls_disable param (HTTPS unless tls_disable=true). Override only if needed.
    scheme: ""
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Use annotations for cloud-provider load balancer customization (AWS NLB, GCP L4, Azure).
  service:
    api:
      type: LoadBalancer
      port: 9200
      targetPort: 9200
      annotations: {}
    # Cluster listener — internal worker registration.
    cluster:
      type: ClusterIP
      port: 9201
      targetPort: 9201
      annotations: {}
    # Ops listener — health checks and metrics.
    ops:
      type: ClusterIP
      port: 9203
      targetPort: 9203
      annotations: {}

# ---------------------------------------------------------------------------
# Database Jobs
# ---------------------------------------------------------------------------

database:
  init:
    enabled: true
  migrate:
    # Enable as a one-time flag during upgrades.
    enabled: false
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  repair:
    # When set, runs a repair migration for the specified version during upgrade.
    version: ""

# ---------------------------------------------------------------------------
# Bootstrap Admin
# ---------------------------------------------------------------------------

bootstrapAdmin:
  enabled: true
  runOnUpgrade: false
  waitTimeoutSeconds: 120
  authMethodName: "bootstrap-auth-method"
  userResourceName: "bootstrap-admin"
  accountResourceName: "bootstrap-admin"
  roleName: "bootstrap-global-admin"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------

# The chart does not create a ServiceAccount. 
# Use a dedicated ServiceAccount in production instead of the default.
serviceAccount:
  name: "default"
  automountServiceAccountToken: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Must exceed graceful_shutdown_wait_duration in controller.config (default 10s).
terminationGracePeriodSeconds: 15

# ---------------------------------------------------------------------------
# OpenShift
# ---------------------------------------------------------------------------

openshift:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  route:
    api:
      enabled: true
      host: ""
      tls:
        termination: reencrypt
        insecureEdgeTerminationPolicy: Redirect
        destinationCACertificate: ""
      annotations: {}
    cluster:
      enabled: true
      host: ""
      annotations: {}
    ops:
      enabled: true
      host: ""
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
        destinationCACertificate: ""
      annotations: {}
