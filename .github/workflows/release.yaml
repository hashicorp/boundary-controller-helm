name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'      # stable tags (for example: v1.2.3)
      - 'v*.*.*-*'    # prerelease tags (for example: v1.2.3-beta)

permissions:
  contents: write

jobs:
  update-helm-charts-index:
    name: update-helm-charts-index
    if: startsWith(github.ref, 'refs/tags/v') && github.ref_name != ''
    runs-on: ubuntu-latest
    environment: release-helm-controller
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: verify tag format
        run: |-
          tag="${{ github.ref_name }}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag (${tag}) must match v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<prerelease>"
            exit 1
          fi

      - name: verify Chart version matches tag version
        run: |-
          export TAG=${{ github.ref_name }}
          git_tag="${TAG#v}"
          chart_tag=$(yq -r '.version' Chart.yaml)
          if [ "${git_tag}" != "${chart_tag}" ]; then
            echo "chart version (${chart_tag}) did not match git version (${git_tag})"
            exit 1
          fi

      - name: update helm-charts index
        id: update
        env:
          GH_TOKEN: ${{ secrets.HELM_CHARTS_GITHUB_TOKEN }}
        run: |-
          gh workflow run publish-charts.yml \
            --repo hashicorp/helm-charts \
            --ref main \
            -f SOURCE_TAG="${{ github.ref_name }}" \
            -f SOURCE_REPO="${{ github.repository }}"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: update-helm-charts-index
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract changelog entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d;/^---/d' \
            > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md entry found for ${VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
